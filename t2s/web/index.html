<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text2Blender Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f4f4f1;
        color: #202124;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid #d7d7d2;
        background: #ffffff;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .meta {
        margin: 0;
        color: #5f6368;
        font-size: 13px;
      }

      main {
        min-height: 0;
        display: grid;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        min-height: 520px;
        background: #ecebe6;
        --poster-color: #ecebe6;
        cursor: grab;
        touch-action: pan-y;
      }

      model-viewer:active {
        cursor: grabbing;
      }

      .status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: min(460px, calc(100vw - 32px));
        padding: 10px 12px;
        border: 1px solid #d7d7d2;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        color: #3c4043;
        font-size: 13px;
        line-height: 1.45;
      }

      @media (max-width: 640px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        model-viewer {
          min-height: 460px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>45平米一居室</h1>
        <p class="meta">卧室 / 客厅 / 开放式厨房 / 卫生间</p>
      </div>
      <p class="meta">scene.glb</p>
    </header>
    <main>
      <model-viewer
        src="./scene.glb"
        camera-controls
        auto-rotate
        auto-rotate-delay="1400"
        rotation-per-second="18deg"
        camera-orbit="35deg 58deg 9m"
        min-camera-orbit="auto 18deg 4.5m"
        max-camera-orbit="auto 82deg 14m"
        field-of-view="32deg"
        interpolation-decay="140"
        interaction-prompt="auto"
        shadow-intensity="0.8"
        exposure="0.95"
        ar
      >
        <div class="status" slot="poster">
          等待加载 scene.glb。请先运行 Blender 导出命令，或把生成的 GLB 放到 web/scene.glb。
        </div>
      </model-viewer>
    </main>
  </body>
</html>
